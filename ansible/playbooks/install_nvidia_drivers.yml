      ansible.builtin.set_fact:
        daemon_config: "{{ daemon_config | combine({'dns': dns_servers, 'default-runtime': 'nvidia', 'runtimes': {'nvidia': {'path': 'nvidia-container-runtime', 'runtimeArgs': []}}}) }}"

