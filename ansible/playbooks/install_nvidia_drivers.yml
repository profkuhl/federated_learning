---
# Comprehensive NVIDIA Driver Management Playbook
# Handles: driver installation, Docker DNS/GPU configuration, verification
# Processes clients first, then server to avoid losing Ansible control

- name: Install and Configure NVIDIA Drivers on Client Nodes
  hosts: nvflare_clients
  become: yes
  gather_facts: yes
  vars:
    target_driver_version: "570"
    dns_servers:
      - "1.1.1.1"
      - "8.8.8.8"

  tasks:
    # ========================================
    # Phase 1: Check Current State
    # ========================================
    - name: Check for NVIDIA hardware
      ansible.builtin.shell: lspci | grep -i nvidia
      register: nvidia_hardware_check
      failed_when: false
      changed_when: false

    - name: Fail if no NVIDIA hardware detected
      ansible.builtin.fail:
        msg: "No NVIDIA hardware detected on {{ inventory_hostname }}"
      when: nvidia_hardware_check.stdout == ""

    - name: Display detected NVIDIA hardware
      ansible.builtin.debug:
        msg: "Detected: {{ nvidia_hardware_check.stdout_lines }}"

    - name: Check current NVIDIA driver version
      ansible.builtin.shell: |
        if command -v nvidia-smi &> /dev/null; then
          nvidia-smi --query-gpu=driver_version --format=csv,noheader | head -1
        else
          echo "not_installed"
        fi
      register: current_driver_version
      failed_when: false
      changed_when: false

    - name: Get installed NVIDIA packages
      ansible.builtin.shell: dpkg -l | grep nvidia-driver | awk '{print $2, $3}'
      register: driver_package_info
      failed_when: false
      changed_when: false

    - name: Display current driver status
      ansible.builtin.debug:
        msg:
          - "Node: {{ inventory_hostname }}"
          - "Hardware: {{ nvidia_hardware_check.stdout_lines[0] }}"
          - "Current Driver: {{ current_driver_version.stdout }}"
          - "Installed Packages: {{ driver_package_info.stdout_lines | join(', ') if driver_package_info.stdout_lines else 'None' }}"

    # ========================================
    # Phase 2: Fix Repository Conflicts & Update Cache
    # ========================================
    - name: Remove conflicting NVIDIA Container Toolkit repository files
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/apt/sources.list.d/nvidia-container-toolkit.list
        - /etc/apt/sources.list.d/nvidia-docker.list
      ignore_errors: yes

    - name: Add graphics-drivers PPA
      ansible.builtin.apt_repository:
        repo: ppa:graphics-drivers/ppa
        state: present
        update_cache: no
      register: ppa_result
      ignore_errors: yes

    - name: Display PPA status
      ansible.builtin.debug:
        msg: "PPA Add: {{ 'Success' if ppa_result.failed == false else 'Failed (continuing anyway)' }}"

    - name: Update package cache
      ansible.builtin.apt:
        update_cache: yes
        cache_valid_time: 3600
      ignore_errors: yes

    # ========================================
    # Phase 3: Clean Old Drivers (if needed)
    # ========================================
    - name: Check if driver upgrade/reinstall is needed
      ansible.builtin.set_fact:
        driver_change_needed: "{{ current_driver_version.stdout != target_driver_version ~ '.195.03' and current_driver_version.stdout != 'not_installed' }}"

    - name: Remove old NVIDIA driver packages
      ansible.builtin.apt:
        name:
          - "nvidia-driver-*"
          - "nvidia-dkms-*"
        state: absent
        purge: yes
      register: driver_removal
      ignore_errors: yes
      when: driver_change_needed

    - name: Clean up after removal
      ansible.builtin.apt:
        autoremove: yes
        autoclean: yes
      when: driver_removal.changed

    # ========================================
    # Phase 4: Install Target Driver
    # ========================================
    - name: Install NVIDIA driver {{ target_driver_version }}
      ansible.builtin.apt:
        name:
          - "nvidia-driver-{{ target_driver_version }}"
          - "nvidia-dkms-{{ target_driver_version }}"
        state: present
        update_cache: yes
      register: nvidia_install

    - name: Blacklist nouveau driver
      ansible.builtin.lineinfile:
        path: /etc/modprobe.d/blacklist-nouveau.conf
        line: "{{ item }}"
        create: yes
      with_items:
        - "blacklist nouveau"
        - "options nouveau modeset=0"
      register: blacklist_nouveau

    - name: Update initramfs
      ansible.builtin.command: update-initramfs -u
      when: blacklist_nouveau.changed or nvidia_install.changed

    - name: Add nvidia to modules
      ansible.builtin.lineinfile:
        path: /etc/modules
        line: nvidia
        create: yes

    # ========================================
    # Phase 5: Configure Docker for GPU Support
    # ========================================
    - name: Create /etc/docker directory
      ansible.builtin.file:
        path: /etc/docker
        state: directory
        mode: '0755'

    - name: Check if daemon.json exists
      ansible.builtin.stat:
        path: /etc/docker/daemon.json
      register: daemon_json_stat

    - name: Read existing daemon.json if it exists
      ansible.builtin.slurp:
        src: /etc/docker/daemon.json
      register: daemon_json_content
      when: daemon_json_stat.stat.exists

    - name: Parse existing daemon.json
      ansible.builtin.set_fact:
        daemon_config: "{{ daemon_json_content.content | b64decode | from_json }}"
      when: daemon_json_stat.stat.exists

    - name: Set default daemon config if file doesn't exist
      ansible.builtin.set_fact:
        daemon_config: {}
      when: not daemon_json_stat.stat.exists

    - name: Merge DNS and default runtime configuration
      ansible.builtin.set_fact:
        daemon_config: "{{ daemon_config | combine({'dns': dns_servers, 'default-runtime': 'nvidia', 'runtimes': {'nvidia': {'path': 'nvidia-container-runtime', 'runtimeArgs': []}}}) }}"

    - name: Write updated daemon.json
      ansible.builtin.copy:
        content: "{{ daemon_config | to_nice_json }}"
        dest: /etc/docker/daemon.json
        mode: '0644'
      register: docker_config_updated

    # ========================================
    # Phase 6: Install NVIDIA Container Toolkit
    # ========================================
    - name: Configure NVIDIA Container Toolkit repository via script
      ansible.builtin.shell: |
        curl -fsSL https://nvidia.github.io/libnvidia-container/gpgkey | gpg --dearmor -o /usr/share/keyrings/nvidia-container-toolkit-keyring.gpg
        curl -s -L https://nvidia.github.io/libnvidia-container/stable/deb/nvidia-container-toolkit.list | \
          sed 's#deb https://#deb [signed-by=/usr/share/keyrings/nvidia-container-toolkit-keyring.gpg] https://#g' | \
          tee /etc/apt/sources.list.d/nvidia-container-toolkit.list
      args:
        creates: /usr/share/keyrings/nvidia-container-toolkit-keyring.gpg
      register: nvidia_repo_configured

    - name: Update apt cache after adding NVIDIA repository
      ansible.builtin.apt:
        update_cache: yes
      when: nvidia_repo_configured.changed

    - name: Install NVIDIA Container Toolkit
      ansible.builtin.apt:
        name: nvidia-container-toolkit
        state: present
        update_cache: yes
      register: nvidia_toolkit_install

    # ========================================
    # Phase 7: Reboot if Needed
    # ========================================
    - name: Check if reboot is required
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: reboot_required_file

    - name: Determine if reboot is needed
      ansible.builtin.set_fact:
        needs_reboot: "{{ reboot_required_file.stat.exists or nvidia_install.changed or blacklist_nouveau.changed }}"

    - name: Display reboot status
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }} - Reboot needed: {{ needs_reboot }}"

    - name: Reboot nodes if required
      ansible.builtin.reboot:
        msg: "Rebooting after NVIDIA driver installation"
        connect_timeout: 10
        reboot_timeout: 300
        pre_reboot_delay: 5
        post_reboot_delay: 30
      when: needs_reboot

    - name: Wait for nodes to come back online
      ansible.builtin.wait_for_connection:
        connect_timeout: 10
        sleep: 5
        delay: 10
        timeout: 300
      when: needs_reboot

    # ========================================
    # Phase 8: Restart Docker (if config changed but no reboot)
    # ========================================
    - name: Restart Docker service if config changed
      ansible.builtin.systemd:
        name: docker
        state: restarted
      when: (docker_config_updated.changed or nvidia_toolkit_install.changed) and not needs_reboot

    - name: Wait for Docker to be ready
      ansible.builtin.wait_for:
        timeout: 10
      when: (docker_config_updated.changed or nvidia_toolkit_install.changed) and not needs_reboot

    # ========================================
    # Phase 9: Verification
    # ========================================
    - name: Verify nvidia-smi works
      ansible.builtin.shell: nvidia-smi --query-gpu=name,driver_version,memory.total --format=csv,noheader
      register: nvidia_smi_verification
      failed_when: nvidia_smi_verification.rc != 0
      changed_when: false
      retries: 3
      delay: 10

    - name: Display nvidia-smi output
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }}: {{ nvidia_smi_verification.stdout }}"

    - name: Test Docker DNS resolution
      ansible.builtin.command: docker run --rm alpine nslookup registry-1.docker.io
      register: dns_test
      changed_when: false
      failed_when: false

    - name: Display DNS test result
      ansible.builtin.debug:
        msg: "DNS Test: {{ 'PASS' if dns_test.rc == 0 else 'FAIL - ' + dns_test.stderr }}"

    - name: Test Docker GPU access
      ansible.builtin.command: docker run --rm --gpus all nvidia/cuda:12.0.0-base-ubuntu22.04 nvidia-smi
      register: gpu_test
      changed_when: false
      failed_when: false
      timeout: 120

    - name: Display GPU test result
      ansible.builtin.debug:
        msg: "GPU Docker Test: {{ 'PASS' if gpu_test.rc == 0 else 'FAIL - ' + (gpu_test.stderr | default('timeout or error')) }}"

    - name: Display success summary for client
      ansible.builtin.debug:
        msg:
          - "========================================"
          - "NVIDIA Driver Setup Complete: {{ inventory_hostname }}"
          - "Driver Version: {{ nvidia_smi_verification.stdout.split(',')[1] | trim }}"
          - "GPU: {{ nvidia_smi_verification.stdout.split(',')[0] | trim }}"
          - "Docker DNS: {{ 'OK' if dns_test.rc == 0 else 'FAILED' }}"
          - "Docker GPU: {{ 'OK' if gpu_test.rc == 0 else 'FAILED' }}"
          - "========================================"

# ========================================
# Now Process Server Node (After All Clients)
# ========================================
- name: Install and Configure NVIDIA Drivers on Server Node
  hosts: nvflare_server
  become: yes
  gather_facts: yes
  vars:
    target_driver_version: "570"
    dns_servers:
      - "1.1.1.1"
      - "8.8.8.8"

  tasks:
    # ========================================
    # Phase 1: Check Current State
    # ========================================
    - name: Check for NVIDIA hardware
      ansible.builtin.shell: lspci | grep -i nvidia
      register: nvidia_hardware_check
      failed_when: false
      changed_when: false

    - name: Fail if no NVIDIA hardware detected
      ansible.builtin.fail:
        msg: "No NVIDIA hardware detected on {{ inventory_hostname }}"
      when: nvidia_hardware_check.stdout == ""

    - name: Display detected NVIDIA hardware
